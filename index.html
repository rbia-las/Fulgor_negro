<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pokédex de Basti">
<meta name="theme-color" content="#e3350d">
<title>Johto Pokédex ✿ ジョウト地方</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='46' fill='%23fff' stroke='%231a1a1a' stroke-width='6'/%3E%3Cpath d='M4 50a46 46 0 0 1 92 0z' fill='%23e3350d' stroke='%231a1a1a' stroke-width='6'/%3E%3Crect x='4' y='47' width='92' height='6' fill='%231a1a1a'/%3E%3Ccircle cx='50' cy='50' r='14' fill='%23fff' stroke='%231a1a1a' stroke-width='6'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --dex-red: #e3350d;
    --dex-red-dark: #a8260a;
    --dex-red-darker: #7d1c07;
    --screen-cream: #fff8fc;
    --screen-edge: #ead2df;
    --ink: #23241f;
    --ink-soft: #5b5c54;
    --gold: #ffd86b;
    --gold-dark: #c28b20;
    --caught-green: #4cae78;
    --lens-blue: #9edcff;
    --lens-blue-dark: #5a9fd0;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background: radial-gradient(circle at 20% 0%, #ffd9e8 0%, #f7b9d2 28%, #c9b7e8 58%, #8ea7d8 100%);
    font-family:'Nunito', sans-serif;
    color:var(--ink);
    padding: 24px 12px 60px;
  }
  .dex{
    max-width: 980px;
    margin: 0 auto;
    border-radius: 28px;
    background: linear-gradient(180deg, var(--dex-red) 0%, var(--dex-red-dark) 100%);
    box-shadow: 0 20px 50px rgba(0,0,0,.55), inset 0 2px 0 rgba(255,255,255,.25);
    padding: 18px;
    border: 3px solid var(--dex-red-darker);
  }
  .dex-header{
    display:flex;
    align-items:center;
    gap:18px;
    padding: 10px 14px 18px;
  }
  .lens-wrap{
    position:relative;
    width:64px; height:64px;
    border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #fff, #cfe9ff 40%, var(--lens-blue) 55%, var(--lens-blue-dark) 100%);
    box-shadow: 0 4px 0 rgba(0,0,0,.35), 0 0 0 6px rgba(255,255,255,.85), 0 0 0 9px rgba(0,0,0,.25);
    flex-shrink:0;
  }
  .lens-wrap::after{
    content:'';
    position:absolute; top:10px; left:12px;
    width:16px; height:16px;
    background: rgba(255,255,255,.9);
    border-radius:50%;
    filter: blur(1px);
  }
  .lights{ display:flex; gap:8px; margin-left:4px; }
  .light{ width:12px; height:12px; border-radius:50%; box-shadow: inset 0 -2px 2px rgba(0,0,0,.3), 0 0 0 2px rgba(0,0,0,.2); }
  .light.y{ background:#ffe14d; }
  .light.g{ background:#3ddc6a; }
  .light.r{ background:#ff5c4d; }

  .pokeball{
    width:34px; height:34px;
    border-radius:50%;
    background: linear-gradient(#fff 0%, #fff 48%, #1a1a1a 48%, #1a1a1a 52%, var(--dex-red) 52%, var(--dex-red) 100%);
    box-shadow: 0 0 0 2px #1a1a1a, 0 3px 0 rgba(0,0,0,.35);
    position:relative;
    flex-shrink:0;
  }
  .pokeball::after{
    content:'';
    position:absolute;
    top:50%; left:50%;
    width:12px; height:12px;
    background:#fff;
    border:3px solid #1a1a1a;
    border-radius:50%;
    transform:translate(-50%,-50%);
  }
  .dex-title{
    font-family:'Press Start 2P', monospace;
    color:#fff;
    font-size: clamp(14px, 3vw, 22px);
    letter-spacing: 1px;
    text-shadow: 2px 2px 0 rgba(0,0,0,.35);
    margin-left:auto;
    text-align:right;
    line-height:1.4;
  }
  .dex-title small{
    display:block;
    font-family:'Nunito', sans-serif;
    font-size:11px;
    color:#ffe9df;
    letter-spacing: 0.5px;
    font-weight:700;
  }

  .screen{
    background: var(--screen-cream);
    border-radius: 16px;
    border: 6px solid var(--screen-edge);
    padding: 16px;
    box-shadow: inset 0 3px 10px rgba(0,0,0,.25);
  }

  .progress-row{
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom:14px;
    flex-wrap:wrap;
  }
  .progress-label{
    font-weight:800;
    font-size:14px;
    color:var(--ink);
    white-space:nowrap;
  }
  .progress-bar-track{
    flex:1;
    min-width:140px;
    height:14px;
    background:#e2ded0;
    border-radius:8px;
    overflow:hidden;
    border: 2px solid #cfc9b4;
  }
  .progress-bar-fill{
    height:100%;
    background: linear-gradient(90deg, var(--caught-green), #8ce0a8);
    border-radius:8px;
    transition: width .4s ease;
  }
  .progress-count{
    font-weight:800;
    font-size:14px;
    color:var(--dex-red-dark);
    white-space:nowrap;
  }

  .controls{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:12px;
  }
  .search-input{
    flex:1;
    min-width:160px;
    padding:9px 14px;
    border-radius:999px;
    border:2px solid var(--screen-edge);
    font-family:'Nunito';
    font-size:14px;
    font-weight:600;
    background:#fff;
    color:var(--ink);
    outline:none;
  }
  .search-input:focus{ border-color: var(--lens-blue-dark); }
  select.filter-select{
    padding:9px 12px;
    border-radius:999px;
    border:2px solid var(--screen-edge);
    background:#fff;
    font-family:'Nunito';
    font-weight:700;
    font-size:13px;
    color:var(--ink);
    outline:none;
  }
  .reset-btn{
    padding:9px 14px;
    border-radius:999px;
    border:2px solid #d9503f;
    background:#fff5f3;
    color:#b6392a;
    font-weight:800;
    font-size:13px;
    cursor:pointer;
  }
  .reset-btn:hover{ background:#ffe4df; }

  .gen-row{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
    margin-bottom:14px;
  }
  .gen-chip{
    padding:6px 11px;
    border-radius:999px;
    border:2px solid var(--screen-edge);
    background:#fff;
    font-size:12px;
    font-weight:800;
    color:var(--ink-soft);
    cursor:pointer;
  }
  .gen-chip.active{
    background: var(--gold);
    border-color: var(--gold-dark);
    color:#4a3a00;
  }

  .grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap:12px;
    max-height: 620px;
    overflow-y:auto;
    padding: 4px 4px 8px 0;
  }
  .grid::-webkit-scrollbar{ width:10px; }
  .grid::-webkit-scrollbar-thumb{ background:#cfc9b4; border-radius:6px; }

  .card{
    background:#fff;
    border-radius:16px;
    border:2px solid #e6e2d2;
    padding:10px 8px 12px;
    text-align:center;
    cursor:pointer;
    user-select:none;
    transition: transform .12s ease, box-shadow .12s ease;
    position:relative;
  }
  .card:hover{ transform: translateY(-2px); box-shadow: 0 6px 14px rgba(0,0,0,.12); }
  .card:active{ transform: scale(.96); }
  .card .num{
    font-size:10px;
    font-weight:800;
    color:var(--ink-soft);
    margin-bottom:2px;
  }
  .card img{
    width:100px; height:100px;
    image-rendering: auto;
    filter: grayscale(1) brightness(.55);
    transition: filter .25s ease;
  }
  .card.caught img{ filter:none; }
  .card.shiny img{ filter:none; }
  .card.shiny{
    box-shadow: 0 0 0 3px var(--gold), 0 4px 10px rgba(212,166,0,.4);
  }
  .card .name{
    font-size:12px;
    font-weight:700;
    margin-top:4px;
    text-transform:capitalize;
    color:var(--ink);
  }
  .badge{
    position:absolute;
    top:4px; right:4px;
    font-size:13px;
  }
  .status-label{
    display:inline-block;
    margin-top:3px;
    font-size:10px;
    font-weight:800;
    padding:2px 7px;
    border-radius:999px;
  }
  .status-label.falta{ background:#eee9db; color:#8a8674; }
  .status-label.tiene{ background:#d9f2e2; color:var(--caught-green); }
  .status-label.shiny_label{ background:#fff3c4; color:var(--gold-dark); }

  .loading, .empty{
    text-align:center;
    padding:60px 20px;
    color:var(--ink-soft);
    font-weight:700;
  }
  .loading{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
  }
  .pokeball-spinner{
    width:56px; height:56px;
    border-radius:50%;
    background: linear-gradient(#fff 0%, #fff 48%, #1a1a1a 48%, #1a1a1a 52%, var(--dex-red) 52%, var(--dex-red) 100%);
    box-shadow: 0 0 0 3px #1a1a1a;
    position:relative;
    animation: spin 1s linear infinite;
  }
  .pokeball-spinner::after{
    content:'';
    position:absolute;
    top:50%; left:50%;
    width:18px; height:18px;
    background:#fff;
    border:4px solid #1a1a1a;
    border-radius:50%;
    transform:translate(-50%,-50%);
  }
  @keyframes spin{
    0%{ transform: rotate(0deg); }
    100%{ transform: rotate(360deg); }
  }
  .footer-note{
    text-align:center;
    color:#8a8674;
    font-size:11px;
    margin-top:10px;
    font-weight:700;
  }

  body::before{
    content:'✦  ♡  ✧  ♡  ✦';
    position:fixed;
    top:10px; left:0; right:0;
    text-align:center;
    color:rgba(255,255,255,.9);
    font-size:22px;
    letter-spacing:18px;
    pointer-events:none;
    z-index:0;
  }
  .dex{position:relative; z-index:1;}
  .dex-title{font-family:'Nunito',sans-serif!important;font-weight:900!important;letter-spacing:1.5px!important;}
  .dex-title small{font-weight:800!important;}
  .screen{box-shadow:inset 0 3px 10px rgba(150,70,110,.10), 0 5px 0 rgba(255,255,255,.35);}
  .search-input, select.filter-select{
    border-color:#e7c5d6!important;
    background:#fff!important;
  }
  .reset-btn{border-color:#e5a9c3!important;background:#fff5fa!important;color:#a73565!important;}
  .gen-chip.active{background:#ffd6e7!important;border-color:#e7a7c4!important;color:#7d3153!important;}
  .card{
    border-color:#efd7e3!important;
    background:linear-gradient(180deg,#fff 0%,#fff8fc 100%)!important;
  }
  .card:hover{box-shadow:0 7px 18px rgba(180,75,125,.18)!important;}
  .card.caught{border-color:#b9dfc8!important;background:linear-gradient(180deg,#fff 0%,#f5fff8 100%)!important;}
  .card.shiny{border-color:#f0cf68!important;background:linear-gradient(180deg,#fff 0%,#fffaf0 100%)!important;}
  .status-label.tiene{background:#e0f5e8!important;color:#3c9463!important;}
  .status-label.falta{background:#f3eaf0!important;color:#987b8b!important;}
  .footer-note{color:#9a7185!important;}


  .basti-seal{
    position:relative;
    width:150px;
    height:82px;
    margin-left:4px;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:visible;
  }
  .basti-seal img{
    width:145px;
    height:103px;
    object-fit:cover;
    object-position:center top;
    border-radius:50%;
    border:4px solid #fff;
    box-shadow:0 3px 0 rgba(0,0,0,.28), 0 0 0 4px rgba(125,28,7,.35);
    background:#fff;
  }
  .seal-caption{
    position:absolute;
    right:-3px;
    bottom:-9px;
    background:#fff;
    color:#8f2d5a;
    border:2px solid #8f2d5a;
    border-radius:999px;
    padding:3px 7px;
    font-size:9px;
    font-weight:900;
    line-height:1.05;
    text-align:center;
    box-shadow:0 2px 0 rgba(0,0,0,.18);
  }
  .seal-caption span{font-size:8px;}
  @media(max-width:650px){
    .dex-header{gap:9px;padding:8px 7px 16px;}
    .basti-seal{width:105px;height:70px;}
    .basti-seal img{width:105px;height:76px;}
    .seal-caption{font-size:7px;right:-6px;bottom:-6px;}
    .seal-caption span{font-size:6px;}
    .dex-title{font-size:16px!important;}
  }

</style>
</head>

  <div class="screen">
    <div class="progress-row">
      <span class="progress-label">Progreso</span>
      <div class="progress-bar-track"><div class="progress-bar-fill" id="progressFill" style="width:0%"></div></div>
      <span class="progress-count" id="progressCount">0 / 0</span>
    </div>

    <div class="controls">
      <input class="search-input" id="searchInput" type="text" placeholder="Buscar (número o nombre en japonés)...">
      <select class="filter-select" id="statusFilter">
        <option value="all">Todos</option>
        <option value="tiene">Tiene</option>
        <option value="shiny">Shiny</option>
        <option value="falta">Falta</option>
      </select>
      <button class="reset-btn" id="resetBtn">Reiniciar progreso</button>
    </div>

    <div id="content">
      <div class="loading"><div class="pokeball-spinner"></div>Cargando la Pokédex de Johto...</div>
    </div>
    <div class="footer-note">Toca un Pokémon para cambiar su estado: Falta → Tiene → Shiny</div>
  </div>
</div>

<script>
const GEN2_MIN = 152;
const GEN2_MAX = 251;

let allPokemon = [];
let progress = {};
const STORAGE_KEY = 'pokedex-progress-johto-jp-v1';

const spriteUrl = (id) => `https://cdn.jsdelivr.net/gh/PokeAPI/sprites@master/sprites/pokemon/other/official-artwork/${id}.png`;
const fallbackSpriteUrl = (id) => `https://cdn.jsdelivr.net/gh/PokeAPI/sprites@master/sprites/pokemon/${id}.png`;

async function loadProgress(){
  try{
    const res = await window.storage.get(STORAGE_KEY, false);
    if(res && res.value){
      progress = JSON.parse(res.value);
    }
  }catch(e){
    progress = {};
  }
}

async function saveProgress(){
  try{
    await window.storage.set(STORAGE_KEY, JSON.stringify(progress), false);
  }catch(e){
    console.error('No se pudo guardar el progreso', e);
  }
}

function nextStatus(current){
  if(current === 'tiene') return 'shiny';
  if(current === 'shiny') return undefined;
  return 'tiene';
}

async function fetchPokemonList(){
  const ids = [];
  for(let id = GEN2_MIN; id <= GEN2_MAX; id++) ids.push(id);

  const results = await Promise.all(ids.map(async id => {
    try{
      const res = await fetch(`https://pokeapi.co/api/v2/pokemon-species/${id}`);
      const data = await res.json();
      const jpEntry = data.names.find(n => n.language.name === 'ja-Hrkt') || data.names.find(n => n.language.name === 'ja');
      return { id, name: jpEntry ? jpEntry.name : `#${id}` };
    }catch(e){
      return { id, name: `#${id}` };
    }
  }));

  allPokemon = results.sort((a,b) => a.id - b.id);
}

function updateProgressBar(){
  const total = allPokemon.length;
  const caughtCount = Object.values(progress).filter(v => v === 'tiene' || v === 'shiny').length;
  const pct = total ? Math.round((caughtCount / total) * 100) : 0;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressCount').textContent = `${caughtCount} / ${total}`;
}

function renderGrid(){
  const content = document.getElementById('content');
  const search = document.getElementById('searchInput').value.trim().toLowerCase();
  const statusFilter = document.getElementById('statusFilter').value;

  let list = allPokemon.slice();

  if(search){
    list = list.filter(p => p.name.toLowerCase().includes(search) || String(p.id) === search || String(p.id).padStart(3,'0').includes(search));
  }

  if(statusFilter !== 'all'){
    list = list.filter(p => {
      const st = progress[p.id];
      if(statusFilter === 'falta') return !st;
      return st === statusFilter;
    });
  }

  if(list.length === 0){
    content.innerHTML = '<div class="empty">No se encontraron Pokémon con esos filtros 🔍</div>';
    return;
  }

  const grid = document.createElement('div');
  grid.className = 'grid';

  list.forEach(p => {
    const status = progress[p.id];
    const card = document.createElement('div');
    card.className = 'card' + (status === 'tiene' ? ' caught' : '') + (status === 'shiny' ? ' shiny caught' : '');

    const statusLabelClass = status === 'tiene' ? 'tiene' : (status === 'shiny' ? 'shiny_label' : 'falta');
    const statusLabelText = status === 'tiene' ? 'Tiene' : (status === 'shiny' ? '✨ Shiny' : 'Falta');

    card.innerHTML = `
      <div class="num">#${String(p.id).padStart(3,'0')}</div>
      <img src="${spriteUrl(p.id)}" alt="${p.name}" loading="lazy" data-fallback="${fallbackSpriteUrl(p.id)}" onerror="if(!this.dataset.triedFallback){this.dataset.triedFallback='1'; this.src=this.dataset.fallback;} else {this.style.opacity=0.15;}">
      <div class="name">${p.name}</div>
      <div class="status-label ${statusLabelClass}">${statusLabelText}</div>
    `;

    card.addEventListener('click', () => {
      const current = progress[p.id];
      const next = nextStatus(current);
      if(next){
        progress[p.id] = next;
      } else {
        delete progress[p.id];
      }
      saveProgress();
      updateProgressBar();
      renderGrid();
    });

    grid.appendChild(card);
  });

  content.innerHTML = '';
  content.appendChild(grid);
}

document.getElementById('searchInput').addEventListener('input', renderGrid);
document.getElementById('statusFilter').addEventListener('change', renderGrid);
document.getElementById('resetBtn').addEventListener('click', async () => {
  if(confirm('¿Seguro que quieres reiniciar todo el progreso?')){
    progress = {};
    await saveProgress();
    updateProgressBar();
    renderGrid();
  }
});

(async function init(){
  await loadProgress();
  try{
    await fetchPokemonList();
  }catch(e){
    document.getElementById('content').innerHTML = '<div class="empty">No se pudo cargar la lista de Pokémon. Revisa tu conexión e intenta de nuevo. 😕</div>';
    return;
  }
  updateProgressBar();
  renderGrid();
})();
</script>
